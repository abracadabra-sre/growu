<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Вырасти героя</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#2b1b4a;--panel:#3d2a6b;--pink:#ff8ab8;--mint:#7ef0c8;--butter:#ffe27a;--sky:#8fd3ff;--text:#fff4ff;--dim:#c9b8ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 30%,#4b3390 0%,var(--bg) 65%);color:var(--text);font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 16px calc(env(safe-area-inset-bottom,0) + 14px);overflow:hidden;user-select:none}
header{position:relative;padding-top:14px;text-align:center}
h1{font-size:26px;font-weight:600;margin:0;letter-spacing:.2px}
.stage{color:var(--butter);font-size:15px;margin-top:2px;min-height:20px}
.xp{height:10px;background:#00000040;border-radius:9px;margin:10px auto 0;max-width:340px;overflow:hidden}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--butter));border-radius:9px;transition:width .5s}
.arena{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.bubble{background:var(--text);color:#3a2466;padding:8px 14px;border-radius:16px;font-size:15px;max-width:260px;text-align:center;position:relative;margin-bottom:10px;min-height:38px;display:flex;align-items:center}
.bubble:after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--text)}
.hero{width:min(44vw,180px);aspect-ratio:200/220;transition:transform .5s cubic-bezier(.3,1.6,.5,1);cursor:pointer}
.hero.idle{animation:bob 2.4s ease-in-out infinite}
.hero.hop{animation:hop .5s ease}
@keyframes bob{50%{transform:translateY(-8px) scale(1.02,.98)}}
@keyframes hop{30%{transform:translateY(-30px) scale(.95,1.06)}60%{transform:translateY(0) scale(1.06,.94)}}
.hero svg{width:100%;height:100%;overflow:visible}
.blink{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.shadow{width:120px;height:14px;background:#0000004d;border-radius:50%;margin-top:-4px;filter:blur(3px)}
.fx{position:absolute;pointer-events:none;font-size:26px;animation:rise 1.2s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-90px) scale(1.4)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:6px auto 12px;width:100%;max-width:380px}
.stat{font-size:13px;color:var(--dim)}
.stat div{height:9px;background:#00000040;border-radius:9px;margin-top:3px;overflow:hidden}
.stat i{display:block;height:100%;border-radius:9px;transition:width .4s,background .4s}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:380px;margin:0 auto}
button{font:inherit;color:var(--text);background:var(--panel);border:0;border-radius:18px;padding:10px 0 8px;font-size:12px;cursor:pointer;box-shadow:0 4px 0 #22144a;transition:transform .08s,box-shadow .08s}
button b{display:block;font-size:28px;font-weight:400;line-height:1.15}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #22144a}
button:focus-visible{outline:3px solid var(--butter)}
button:disabled{opacity:.5}
#end{position:fixed;inset:0;background:#1d0f3acc;display:none;align-items:center;justify-content:center;padding:24px;z-index:5}
#end.on{display:flex}
.card{background:var(--text);color:#3a2466;border-radius:28px;padding:26px 22px;max-width:360px;width:100%;text-align:center;max-height:90vh;overflow:auto}
.card h2{margin:0 0 8px;font-size:28px}
.card p{margin:8px 0;font-size:16px;line-height:1.45}
.card ul{list-style:none;padding:0;margin:12px 0;text-align:left;font-size:15px}
.card li{padding:6px 0;border-bottom:1px dashed #c9b8ee}
.card .from{color:#9a4bd6;font-weight:600;margin-top:12px}
.card button{background:var(--pink);color:#fff;padding:12px 22px;font-size:16px;box-shadow:0 4px 0 #d9568a;margin-top:6px}
.card .reset{background:none;box-shadow:none;color:#9a86c4;font-size:12px;padding:8px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:6}
@media (max-height:640px){.hero{width:150px}.stats{margin-bottom:8px}}
@media (prefers-reduced-motion:reduce){.hero.idle,.blink{animation:none}}
.age{font-size:15px;margin-top:2px}
.gift{position:absolute;right:0;top:14px;width:46px;height:46px;padding:0;font-size:24px;border-radius:50%;opacity:.5}
.gift.ready{opacity:1;background:var(--pink);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.wish{position:absolute;top:4px;right:2px;background:var(--text);color:#3a2466;border-radius:16px;padding:4px 10px;font-size:20px}
#toast{position:fixed;top:12px;left:50%;transform:translate(-50%,-160%);background:var(--butter);color:#3a2466;padding:10px 16px;border-radius:16px;z-index:9;max-width:88vw;text-align:center;transition:transform .4s;font-size:15px}
#toast.on{transform:translate(-50%,0)}
#game,#shop{position:fixed;inset:0;display:none;z-index:7}
#game{background:#1d0f3af0;flex-direction:column}
#shop{background:#1d0f3acc;align-items:center;justify-content:center;padding:24px}
#game.on,#shop.on{display:flex}
#gbar{text-align:center;font-size:22px;padding:calc(env(safe-area-inset-top,0px) + 14px) 0 6px}
#garea{flex:1;position:relative;overflow:hidden;touch-action:manipulation}
.drop{position:absolute;top:-50px;font-size:40px;animation:fall linear forwards;cursor:pointer}
@keyframes fall{to{transform:translateY(110vh)}}
.fx.star{pointer-events:auto;cursor:pointer;animation:twinkle .8s ease-in-out infinite alternate}
@keyframes twinkle{to{transform:scale(1.4) rotate(20deg)}}
.card li{display:flex;justify-content:space-between;align-items:center}
.card li button{padding:6px 12px;font-size:13px;margin:0}
.cat{position:absolute;bottom:14px;right:3%;width:60px;cursor:pointer;display:none;animation:bob 3s ease-in-out infinite}
.cat svg{width:100%;display:block}
.treat{position:absolute;bottom:84px;right:3%;display:none;padding:4px 10px;font-size:14px;border-radius:14px}
#jump{position:fixed;inset:0;display:none;z-index:7;background:#241547}
#jump.on{display:block}
#jc{display:block;width:100%;height:100%;touch-action:none}
#jx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;padding:6px 12px;font-size:16px}
.jarrow{position:absolute;bottom:26px;width:64px;height:64px;border-radius:50%;background:#ffffff26;border:2px solid #ffffff55;font-size:26px;color:#fff;display:flex;align-items:center;justify-content:center;z-index:8}
#jleft{left:18px}#jright{right:18px}
.cat.hungry{animation:shake .5s infinite}
@keyframes shake{25%{transform:translateX(-3px) rotate(-3deg)}75%{transform:translateX(3px) rotate(3deg)}}
.meow{position:absolute;bottom:78px;right:2px;background:var(--text);color:#3a2466;border-radius:14px;padding:3px 9px;font-size:16px;animation:bob 1s ease-in-out infinite}
#cake{position:fixed;inset:0;background:#1d0f3af2;display:none;z-index:8;align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center}
#cake.on{display:flex}
#cake h2{margin:0 0 4px}
#cakeCount{color:var(--butter);margin-bottom:10px;font-size:15px}
.cakebox{width:min(90vw,340px)}
.candles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:-6px}
.candle{position:relative;height:46px;cursor:pointer}
.candle i{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:6px;height:16px;background:linear-gradient(var(--pink),var(--sky));border-radius:2px}
.flame{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:18px;animation:flick .3s ease-in-out infinite alternate}
@keyframes flick{to{transform:translateX(-50%) scale(1.15) rotate(4deg)}}
.candle.out .flame{display:none}
.puff{position:absolute;top:0;left:50%;font-size:16px;opacity:0;pointer-events:none}
.candle.out .puff{animation:puff .6s ease-out forwards}
@keyframes puff{0%{opacity:.9;transform:translate(-50%,0) scale(.6)}100%{opacity:0;transform:translate(-50%,-22px) scale(1.3)}}
.cakebody{height:64px;border-radius:14px 14px 30px 30px;background:linear-gradient(#ffe6f1,#ff9ec4);margin-top:8px;box-shadow:inset 0 -10px 0 #ff80b4}
.cakehint{font-size:13px;color:var(--dim);margin-top:10px}
#mem{position:fixed;inset:0;background:#1d0f3af2;display:none;z-index:8;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 16px}
#mem.on{display:flex}
#memBar{font-size:16px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;width:100%}
.mc{aspect-ratio:1;border-radius:12px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;box-shadow:0 3px 0 #22144a}
.mc.show,.mc.done{background:var(--text);box-shadow:0 3px 0 #c9b8ee}
.mc.done{opacity:.55}
#memx{margin-top:14px}
#daily{position:fixed;inset:0;background:#1d0f3acc;display:none;z-index:9;align-items:center;justify-content:center}
#daily.on{display:flex}
</style>
</head>
<body>

<header>
  <button id="gift" class="gift" aria-label="Поздравление">🎁</button><h1 id="name"></h1>
  <div class="stage" id="stage"></div><div class="age" id="age"></div>
  <div class="xp"><i id="xp"></i></div>
</header>

<div class="arena" id="arena">
  <div class="bubble" id="say"></div>
  <div class="hero idle" id="hero"></div><div class="wish" id="wish"></div>
  <div class="cat" id="cat"><svg viewBox="0 0 80 80"><path d="M58 66Q80 66 74 40" stroke="#1c1c26" stroke-width="7" fill="none" stroke-linecap="round"/><ellipse cx="38" cy="58" rx="22" ry="18" fill="#1c1c26"/><circle cx="34" cy="30" r="17" fill="#1c1c26"/><path d="M20 20L22 3L33 14ZM48 20L46 3L35 14Z" fill="#1c1c26"/><ellipse cx="28" cy="29" rx="3" ry="4.5" fill="#9be15d"/><ellipse cx="40" cy="29" rx="3" ry="4.5" fill="#9be15d"/><path d="M34 35l-2 2h4z" fill="#ff8ab8"/></svg></div>
  <button class="treat" id="treat"></button>
  <div class="meow" id="meow" style="display:none">🍽️ Мяу…</div>
  <div class="shadow"></div>
</div>

<div class="stats" id="stats"></div>

<div class="acts">
  <button data-a="feed"><b>🍰</b>Покормить</button>
  <button data-a="play"><b>🎈</b>Поиграть</button>
  <button data-a="hug"><b>🤗</b>Обнять</button>
  <button data-a="sleep"><b>🌙</b>Уложить</button>
  <button data-a="catch"><b>🎯</b>Подарки</button>
  <button data-a="jump"><b>🦘</b>Прыжки</button>
  <button data-a="mem"><b>🧠</b>Память</button>
  <button data-a="shop"><b>🛍️</b>Гардероб</button>
</div>

<div id="end"><div class="card">
  <h2 id="endTitle"></h2>
  <p id="endMsg"></p>
  <ul id="endWishes"></ul>
  <div class="from" id="endFrom"></div>
  <button id="endOk">Ура! 🎉</button><br>
  <button class="reset" id="reset">Вырастить заново</button>
</div></div>
<div id="game"><div id="gbar"></div><div id="garea"></div></div>
<div id="shop"><div class="card"><h2>Гардероб</h2><p id="shopCoins"></p><ul id="shopList"></ul><button id="shopOk">Закрыть</button></div></div>
<div id="jump"><canvas id="jc"></canvas><button id="jx">✕</button><button id="jleft" class="jarrow">◀</button><button id="jright" class="jarrow">▶</button></div>
<div id="toast"></div>
<div id="mem"><div id="memBar"></div><div class="grid" id="memGrid"></div><button id="memx">Закрыть</button></div>
<div id="cake"><h2>🎂 Задуй все свечи!</h2><div id="cakeCount"></div><div class="cakebox"><div class="candles" id="candles"></div><div class="cakebody"></div></div><div class="cakehint">Тапай по огоньку 🔥</div></div>
<div id="daily"><div class="card"><h2 id="dailyT"></h2><p id="dailyP"></p><button id="dailyOk">Спасибо! 🪙</button></div></div>
<canvas id="conf"></canvas>

<script>
/* ============ ЗДЕСЬ МЕНЯЕМ ПОД ИМЕНИННИКА ============ */
const CONFIG = {
  name: "Владочка",                       // имя героя (например, имя любимого человека)
  endTitle: "С днём рождения, Владочка! 🎂",
  endMessage: "Ты выросла в самую прекрасную девушку на свете. Спасибо, что ты есть!",
  wishes: [                            // список пожеланий в финале
    "🌟 Пусть все мечты сбываются",
    "💛 Пусть рядом будут только любимые люди",
    "🎁 Пусть каждый день будет как маленький праздник"
  ],
  from: "С любовью, твой человек ❤️",
  // воспоминания по годам жизни героя — замени на ваши настоящие, они всплывают при взрослении
  memories: {6:"К тебе пришла чёрная кошка 🐈‍⬛",1:"Первые шаги 👣",3:"Первая любимая игрушка 🧸",5:"Первый раз в первый класс 🎒",7:"Первый настоящий друг 🤝",10:"Первая большая мечта ✨",14:"Модная причёска и бунтарский характер 😎",16:"Первая любовь 💘",18:"Выпускной и совершеннолетие 🎓"}
};
/* ===================================================== */

const STAGES = [
  {t:"Малышка",xp:0,s:.72},{t:"Кроха",xp:42,s:.84},{t:"Непоседа",xp:98,s:.95},
  {t:"Звёздочка",xp:168,s:1.05},{t:"С днём рождения!",xp:280,s:1.16}
];
const COLORS = ["#ffd0e2","#ffbad5","#ffa5c8","#ff90bb","#ff7aae"];
const STATS = {food:["Сытость","#ffb86b"],mood:["Настроение","#ffe27a"],energy:["Бодрость","#7ef0c8"],love:["Любовь","#ff8ab8"],cat:["Кошка","#b48cff"]};
const KEY = "birthday_hero_v3";
const MAX_XP = STAGES[4].xp;
const YEAR = 14;
const age = () => Math.floor(S.xp / YEAR);
const ITEMS = [
  {id:"tee_white",s:"top",n:"Белая футболка",e:"👕",p:0},{id:"tee_heart",s:"top",n:"Футболка с сердечком",e:"💖",p:12},{id:"tee_star",s:"top",n:"Футболка со звездой",e:"⭐",p:12},{id:"tee_cat",s:"top",n:"Футболка с котиком",e:"🐱",p:15},
  {id:"pants_white",s:"bottom",n:"Белые штаны",e:"👖",p:0},{id:"jeans",s:"bottom",n:"Джинсы",e:"👖",p:15},{id:"pants_pink",s:"bottom",n:"Розовые штаны",e:"🩷",p:15},
  {id:"dress_red",s:"dress",n:"Красное платье",e:"👗",p:30},{id:"dress_flower",s:"dress",n:"Платье в цветочек",e:"🌸",p:35},
  {id:"round",s:"glasses",n:"Круглые очки",e:"👓",p:15},{id:"heart",s:"glasses",n:"Очки-сердечки",e:"💗",p:20},
  {id:"bracelet",s:"acc",n:"Браслет",e:"📿",p:8},{id:"bow",s:"acc",n:"Бантик",e:"🎀",p:10}];
const SLOT = {top:"Футболки",bottom:"Штаны",dress:"Платья",glasses:"Очки",acc:"Аксессуары"};
const $ = id => document.getElementById(id);
const tg = window.Telegram && window.Telegram.WebApp;
try { if (tg) { tg.ready(); tg.expand(); } } catch(e){}

let S = fresh();
function fresh(keep){ return Object.assign({xp:0,food:60,mood:60,energy:70,love:50,cat:70,treats:0,sleepUntil:0,done:false,coins:0,owned:["tee_white","pants_white"],wear:{top:"tee_white",bottom:"pants_white",dress:"",glasses:"",acc:[]},wish:"feed",candles:[],cakeOpen:false,day:"",last:Date.now()}, keep||{}); }

/* ---------- сохранение: localStorage + облако Telegram ---------- */
function save(){
  S.last = Date.now();
  const raw = JSON.stringify(S);
  try { localStorage.setItem(KEY, raw); } catch(e){}
  try { if (tg && tg.CloudStorage) tg.CloudStorage.setItem(KEY, raw); } catch(e){}
}
function apply(raw){
  try { const o = JSON.parse(raw); if (o && typeof o.xp === "number") { S = Object.assign(fresh(), o); return true; } } catch(e){}
  return false;
}
function load(){
  try { apply(localStorage.getItem(KEY)); } catch(e){}
  try {
    if (tg && tg.CloudStorage) tg.CloudStorage.getItem(KEY, (err, val) => {
      if (err || !val) return;
      try { const o = JSON.parse(val); if (o.last > S.last) { apply(val); catchUp(); render(); } } catch(e){}
    });
  } catch(e){}
}

/* ---------- время идёт, даже когда игра закрыта (не больше 30 минут) ---------- */
const clamp = v => Math.max(0, Math.min(100, v));
function catchUp(){ S.last = Date.now(); }  /* пока игра закрыта, время стоит */

/* ---------- персонаж ---------- */
const stageOf = () => { let i = 0; STAGES.forEach((s,k) => { if (S.xp >= s.xp) i = k; }); return i; };
const avg = () => (S.food + S.mood + S.energy + S.love) / 4;
const asleep = () => Date.now() < S.sleepUntil;
function face(){
  if (asleep()) return "sleep";
  if (Math.min(S.food,S.mood,S.energy,S.love) < 25) return "sad";
  if (avg() > 65) return "happy";
  return "ok";
}
const SKIN="#ffdcc2",HAIR="#3a2416",EDGE="#e3d9f3";
const TOPS={tee_white:"",tee_heart:"💖",tee_star:"⭐",tee_cat:"🐱"};
const BOTS={pants_white:"#fff",jeans:"#4a6fb5",pants_pink:"#ff9ec4"};
function outfit(){
  const w=S.wear, legs=c=>'<rect x="78" y="168" width="20" height="38" rx="9" fill="'+c+'" stroke="'+EDGE+'"/><rect x="102" y="168" width="20" height="38" rx="9" fill="'+c+'" stroke="'+EDGE+'"/>';
  if(w.dress){ const fl=w.dress==="dress_flower";
    return legs(SKIN)+'<path d="M78 124Q100 118 122 124L140 200Q100 212 60 200Z" fill="'+(fl?"#ff9ec4":"#e85d75")+'"/>'+(fl?'<circle cx="80" cy="182" r="5" fill="#fff"/><circle cx="106" cy="194" r="5" fill="#ffe27a"/><circle cx="124" cy="176" r="5" fill="#fff"/><circle cx="94" cy="156" r="4" fill="#ffe27a"/>':""); }
  return legs(BOTS[w.bottom])+'<path d="M76 124Q100 118 124 124L128 174Q100 180 72 174Z" fill="#fff" stroke="'+EDGE+'"/><ellipse cx="72" cy="130" rx="10" ry="9" fill="#fff" stroke="'+EDGE+'"/><ellipse cx="128" cy="130" rx="10" ry="9" fill="#fff" stroke="'+EDGE+'"/>'+(TOPS[w.top]?'<text x="100" y="158" font-size="24" text-anchor="middle">'+TOPS[w.top]+'</text>':"");
}
function specs(){ const g=S.wear.glasses;
  if(g==="round") return '<g fill="#ffffff22" stroke="#d9a441" stroke-width="3"><circle cx="79" cy="90" r="14"/><circle cx="121" cy="90" r="14"/><path d="M93 90h14"/></g>';
  if(g==="heart") return '<g fill="#ff5c93" fill-opacity=".22" stroke="#ff3d7f" stroke-width="3.5" stroke-linejoin="round"><path d="M79 83C68 73 60 88 79 104C98 88 90 73 79 83Z"/><path d="M121 83C110 73 102 88 121 104C140 88 132 73 121 83Z"/></g><path d="M91 88h18" stroke="#ff3d7f" stroke-width="3"/>';
  return ""; }
function svg(st,f){
  const w=S.wear, sl=f==="sleep";
  const back = st>=2 ? '<path d="M52 84Q50 34 100 34Q150 34 148 84Q152 142 138 152L62 152Q48 142 52 84Z" fill="'+HAIR+'"/>' : '<circle cx="50" cy="106" r="13" fill="'+HAIR+'"/><circle cx="150" cy="106" r="13" fill="'+HAIR+'"/>';
  const arms='<ellipse cx="64" cy="152" rx="8" ry="20" fill="'+SKIN+'" transform="rotate(12 64 152)"/><ellipse cx="136" cy="152" rx="8" ry="20" fill="'+SKIN+'" transform="rotate(-12 136 152)"/><ellipse cx="88" cy="208" rx="13" ry="7" fill="#7a4520"/><ellipse cx="112" cy="208" rx="13" ry="7" fill="#7a4520"/>';
  const eye=x=> sl ? '<path d="M'+(x-8)+' 92Q'+x+' 99 '+(x+8)+' 92" stroke="#2a170b" stroke-width="3.5" fill="none" stroke-linecap="round"/>' : '<g class="blink"><ellipse cx="'+x+'" cy="90" rx="7.5" ry="9.5" fill="#8a4b1f"/><ellipse cx="'+x+'" cy="91" rx="4" ry="5.5" fill="#2a170b"/><circle cx="'+(x+2.5)+'" cy="86" r="2.6" fill="#fff"/></g>';
  const brows=f==="sad"?'<path d="M68 74L90 80M132 74L110 80" stroke="'+HAIR+'" stroke-width="3.5" stroke-linecap="round"/>':"";

function gain(n){
  const a0 = age();
  S.xp = Math.min(MAX_XP, S.xp + n * (avg() > 55 ? 1.5 : 1));
  const a = age();
  if (a > a0) {
    let m = ""; for (let y=a0+1; y<=a; y++) if (CONFIG.memories[y]) m = CONFIG.memories[y];
    if (a < 20) toast("🎂 Тебе уже " + a + " " + yr(a) + (m ? " — " + m : ""));
    fx("🎉"); hop(); try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); } catch(e){}
  }
  if (S.xp >= MAX_XP && !S.done && !S.cakeOpen) { S.cakeOpen = true; setTimeout(openCake, 900); }
}
/* опыт даётся только за то, что герою правда нужно; угаданное желание 💭 даёт х3 и монеты */
const NEED = {feed:"food",play:"mood",hug:"love",sleep:"energy"};
const ACT = {feed:["🍰",6,"Ням-ням! Вкуснотища 😋"],play:["🎈",8,"Ура, ещё раз! 🥳"],hug:["💖",5,"Как же тепло рядом с тобой 🥰"],sleep:["🌙",4,"Спокойной ночи… 💤"]};
function newWish(){ S.wish = ["feed","play","hug","sleep"][Math.random()*4|0]; }
function doAct(k){
  const needed = S[NEED[k]] < 75;
  if (k==="feed" && S.food>92) return say("Больше не влезет, я как шарик 🎈");
  if (k==="play" && S.energy<15) return say("Сил нет… давай поспим 🌙");
  if (k==="sleep" && asleep()) return;
  if (k==="feed") { S.food=clamp(S.food+28); S.mood=clamp(S.mood+4); }
  if (k==="play") { S.mood=clamp(S.mood+28); S.energy=clamp(S.energy-12); S.food=clamp(S.food-6); }
  if (k==="hug")  { S.love=clamp(S.love+28); S.mood=clamp(S.mood+6); }
  if (k==="sleep"){ S.sleepUntil=Date.now()+6000; S.energy=clamp(S.energy+45); setTimeout(render,6100); }
  let xp = needed ? ACT[k][1] : 0;
  if (S.wish === k) { xp = ACT[k][1]*3; S.coins += 3; fx("🪙"); newWish(); say("Ты угадала! Именно этого мне и хотелось 🤩"); }
  else say(needed ? ACT[k][2] : "Спасибо, но мне и так хорошо 😊");
  fx(ACT[k][0]); if (xp) gain(xp);
}

/* ---------- мини-игра: прыгалка (как Doodle Jump) ---------- */
function openJump(){
  if ($("jump").classList.contains("on")) return;
  if (asleep() || S.energy < 20) return say("Нет сил на прыжки… давай отдохнём 🌙");
  S.energy = clamp(S.energy - 15); $("jump").classList.add("on");
  const cv=$("jc"), c=cv.getContext("2d"), W=cv.width=innerWidth, H=cv.height=innerHeight, k=H/700;
  const P={x:W/2,y:H*.7,vy:-15*k}; let tx=W/2, best=0, got=0, run=true, pl=[], cn=[], top=0;
  const add = y => { const x=10+Math.random()*(W-90); pl.push({x,y}); top=y; if (Math.random()<.35) cn.push({x:x+35,y:y-26}); };
  pl.push({x:W/2-35,y:H*.85}); { let y=H*.85-90*k; while (y>-20) { add(y); y-=90*k; } }
  cv.onpointermove = cv.onpointerdown = e => { tx = e.clientX; held=0; };
  let held=0;
  const setHeld = v => d => { d.preventDefault(); held=v; };
  $("jleft").onpointerdown = setHeld(-1); $("jright").onpointerdown = setHeld(1);
  $("jleft").onpointerup = $("jright").onpointerup = $("jleft").onpointerleave = $("jright").onpointerleave = () => held=0;
  function end(){ if(!run) return; run=false; $("jump").classList.remove("on"); const m=Math.floor(best/10); S.coins+=got; gain(Math.min(20,m/8)); toast("Высота: "+m+" м · монет: "+got+" 🪙"); render(); save(); }
  $("jx").onclick = end;
  (function loop(){
    if (!run) return;
    if (held) tx = P.x + held*140; P.x += (tx-P.x)*.25; P.vy += .55*k; P.y += P.vy; if (P.x<16) P.x=W-16; if (P.x>W-16) P.x=16;
    if (P.vy>0) pl.forEach(p => { const f=P.y+30; if (f>=p.y && f-P.vy<=p.y+2 && P.x>p.x-6 && P.x<p.x+76) P.vy=-15*k; });
    if (P.y < H*.4) { const d=H*.4-P.y; P.y=H*.4; pl.forEach(p=>p.y+=d); cn.forEach(o=>o.y+=d); best+=d; top+=d; }
    while (top > -20) add(top-(80+Math.random()*30)*k);
    pl = pl.filter(p => p.y<H+20);
    cn = cn.filter(o => { if (o.y>H+20) return false; if (Math.abs(o.x-P.x)<26 && Math.abs(o.y-P.y)<30) { got++; buzz(); return false; } return true; });
    if (P.y > H+40) return end();
    c.clearRect(0,0,W,H);
    c.fillStyle="#7ef0c8"; pl.forEach(p => c.fillRect(p.x,p.y,70,10));
    c.font="24px serif"; cn.forEach(o => c.fillText("🪙",o.x-12,o.y+8));
    c.fillStyle="#3a2416"; c.beginPath(); c.arc(P.x,P.y-4,17,0,7); c.fill();
    c.fillStyle="#fff"; c.beginPath(); c.moveTo(P.x-11,P.y+22); c.lineTo(P.x+11,P.y+22); c.lineTo(P.x+6,P.y+10); c.lineTo(P.x-6,P.y+10); c.fill();
    c.fillStyle="#ffdcc2"; c.beginPath(); c.arc(P.x,P.y-2,13,0,7); c.fill(); c.fillRect(P.x-6,P.y+22,4,8); c.fillRect(P.x+2,P.y+22,4,8);
    c.fillStyle="#3a2416"; c.beginPath(); c.arc(P.x,P.y-7,13,3.3,6.1); c.fill();
    c.fillStyle="#8a4b1f"; c.fillRect(P.x-7,P.y-3,4,5); c.fillRect(P.x+3,P.y-3,4,5);
    c.fillStyle="#fff"; c.font="20px Fredoka,sans-serif"; c.fillText("⬆ "+Math.floor(best/10)+" м    🪙 "+got, 14, 34);
    requestAnimationFrame(loop);
  })();
}

function openMemory(){
  if ($("mem").classList.contains("on")) return;
  if (asleep() || S.mood < 15) return say("Не до игр сейчас… 😔");
  const ICONS=["🎂","🎈","🎁","💖","⭐","🕯️","👗","🐱"], deck=ICONS.concat(ICONS).map(e=>({e,open:false,done:false}));
  for (let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  let open=[], moves=0, found=0, lock=false;
  const G=$("memGrid"); G.innerHTML="";
  const bar=()=>$("memBar").textContent="Ходы: "+moves+"   Пар: "+found+"/"+ICONS.length;
  deck.forEach((c,i) => {
    const d=document.createElement("div"); d.className="mc";
    d.onclick=()=>{
      if (lock || c.open || c.done || open.length===2) return;
      c.open=true; d.textContent=c.e; d.classList.add("show"); open.push({c,d});
      if (open.length===2) {
        moves++; bar(); lock=true;
        setTimeout(() => {
          if (open[0].c.e===open[1].c.e) { open.forEach(o=>{o.c.done=true;o.d.classList.add("done");}); found++; S.coins+=2; fx("🪙"); bar();
            if (found===ICONS.length) { gain(14); S.coins+=6; toast("Все пары найдены! +6 🪙"); save(); setTimeout(()=>$("mem").classList.remove("on"),700); } }
          else open.forEach(o=>{o.c.open=false;o.d.textContent="";o.d.classList.remove("show");});
          open=[]; lock=false;
        }, 700);
      }
    };
    G.appendChild(d);
  });
  bar(); $("mem").classList.add("on");
}

  const ps = Array.from({length:140}, () => ({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.6,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:4+Math.random()*5,c:cols[Math.random()*5|0],a:Math.random()*6}));

}

function checkDaily(){

  const first = S.day === "";

  const bonus = 8;
  S.coins += bonus;
  $("dailyT").textContent = "С возвращением! 👋";
  $("dailyP").textContent = "Владочка скучала. Держи бонус за новый день: +" + bonus + " 🪙";
  $("daily").classList.add("on");
}
$("dailyOk").onclick = () => { $("daily").classList.remove("on"); render(); save(); };

/* ---------- запуск ---------- */
$("stats").innerHTML = Object.keys(STATS).map(k => '<div class="stat">' + STATS[k][0] + '<div><i id="s_' + k + '"></i></div></div>').join("");
load(); catchUp(); render(); if (S.cakeOpen && !S.done) openCake(); checkDaily();
setInterval(() => {
  if (document.hidden) return; const dt = 1/60;
  if (!asleep()) { S.food = clamp(S.food - 2*dt); S.mood = clamp(S.mood - 1.8*dt); S.love = clamp(S.love - 1.4*dt); S.energy = clamp(S.energy - 1*dt); }
  if (age() >= 6) { S.cat = clamp(S.cat - 1.6*dt); if (S.cat <= 0) S.mood = clamp(S.mood - 1.2*dt); }
  render();
}, 1000);
setInterval(save, 5000);
setInterval(star, 18000);
setInterval(() => { newWish(); render(); }, 35000);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); else { catchUp(); render(); } });
</script>
</body>
</html>
